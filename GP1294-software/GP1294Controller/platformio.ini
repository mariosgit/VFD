; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
; build_flags = -DUSB_SERIAL -DTEENSY_OPT_SMALLEST_CODE

[env:teensy40]
platform = teensy
board = teensy40
framework = arduino

build_type = debug

build_unflags = -DUSB_SERIAL
build_flags = -DUSB_DUAL_SERIAL -DIRQ_DEBUG_OFFSET=1
debug_port = /dev/ttyACM2
debug_tool = custom
debug_load_mode = manual
debug_server = 
debug_init_cmds =
  target extended-remote $DEBUG_PORT
  $INIT_BREAK
  define pio_reset_run_target
  interrupt
  tbreak loop
  continue
  end
  define pio_restart_target
  echo Restart is undefined for now.
  end
debug_init_break =

lib_deps = 
	; u8g2=https://github.com/olikraus/U8g2_Arduino/archive/master.zip
    u8g2=https://github.com/olikraus/U8g2_Arduino/archive/refs/tags/2.36.3.zip
	ftrias/TeensyThreads@^1.0.2
  TeensyDebug=https://github.com/h4yn0nnym0u5e/TeensyDebug.git#3e4802160853c84e4f7d0bb521d9ff07293ac1e4
  adafruit/Adafruit GFX Library@^1.12.6

monitor_speed = 115200
monitor_port = /dev/ttyACM1
;board_build.f_cpu = 150000000L
